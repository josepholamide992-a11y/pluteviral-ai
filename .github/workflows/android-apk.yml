name: PluteViral AI Android tester APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pluteviral-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-apk:
    name: Build installable test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        env:
          NODE_ENV: development
        run: npm install --no-audit --no-fund

      - name: Check TypeScript and app tests
        run: |
          npm run test:core
          npm run typecheck

      - name: Generate native Android project
        env:
          NODE_ENV: development
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Compile standalone Android release APK
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK is installable and includes bundled JavaScript
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle|assets/index.android.bundle.hbc'
          TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$TOOLS/apksigner" verify --verbose "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.plutevia.pluteviral'"
          sha256sum "$APK" | tee PluteViral-AI-test.apk.sha256
          cp "$APK" PluteViral-AI-Android-TEST.apk
          ls -lh PluteViral-AI-Android-TEST.apk

      - name: Upload tester APK
        uses: actions/upload-artifact@v4
        with:
          name: PluteViral-AI-Android-Tester-APK
          path: |
            mobile/PluteViral-AI-Android-TEST.apk
            mobile/PluteViral-AI-test.apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
